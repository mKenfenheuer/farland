<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  farlandd's control API on the system bus (docs/ROADMAP.md M7). Only root
  may own the name; anyone may call it, and farlandd asks polkit
  (org.farland.Farland1.policy) before it does anything on a caller's behalf.
-->
<busconfig>
  <policy user="root">
    <allow own="org.farland.Farland1"/>
    <allow send_destination="org.farland.Farland1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.farland.Farland1" send_interface="org.farland.Farland1"/>
    <allow send_destination="org.farland.Farland1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.farland.Farland1" send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
