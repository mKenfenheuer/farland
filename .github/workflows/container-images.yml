# The desktop images of packaging/container/Containerfile.desktop, GNOME
# and Plasma, for amd64 and arm64, published to the GitHub Container
# Registry as ghcr.io/mkenfenheuer/farland-{gnome,plasma}:
#
#   latest, sha-<commit>  every push to main
#   <tag>                 every tag
#
# Each architecture builds on a runner of its own kind -- compiling farland
# under emulation would take hours -- and pushes by digest; the publish job
# then puts both under one tag.

name: Container images

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push makes the images of an older one obsolete.
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/mkenfenheuer

jobs:
  build:
    # Only this repository publishes: a fork's images are not this
    # project's.
    if: github.repository == 'mKenfenheuer/farland'
    strategy:
      fail-fast: false
      matrix:
        desktop: [gnome, plasma]
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Make room
        # A desktop image and the build stage beside it need more disk than
        # a runner has free; the toolchains nobody here uses give it back.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/farland-${{ matrix.desktop }}
      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/container/Containerfile.desktop
          target: ${{ matrix.desktop }}
          platforms: linux/${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/farland-${{ matrix.desktop }},push-by-digest=true,name-canonical=true,push=true
          # In the registry rather than the Actions cache, whose 10 GB four
          # desktop images would overflow.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/farland-${{ matrix.desktop }}:buildcache-${{ matrix.platform }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/farland-${{ matrix.desktop }}:buildcache-${{ matrix.platform }},mode=max
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.desktop }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    # Both architectures under one tag.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        desktop: [gnome, plasma]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.desktop }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/farland-${{ matrix.desktop }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=ref,event=tag
      - name: Tag the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/farland-${{ matrix.desktop }}
        run: |
          set -eu
          # shellcheck disable=SC2046 # one argument per tag and per digest
          docker buildx imagetools create \
            $(jq -r '.tags[] | "--tag=" + .' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(for digest in *; do printf '%s@sha256:%s ' "$IMAGE" "$digest"; done)
          docker buildx imagetools inspect "$IMAGE:$DOCKER_METADATA_OUTPUT_VERSION"
