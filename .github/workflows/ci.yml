name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Deliberately small, to keep runner minutes down: one build, one test
    # run, one run of the release binary, and the Debian package, installed
    # to check that its multi-session service starts. Sanitizers, fuzzing,
    # clang-tidy, other distributions and compilers, and the compositor
    # tests run locally; CONTRIBUTING.md says how.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo sh ci/install-deps.sh
      - name: Build (release, warnings as errors)
        run: |
          meson setup build --buildtype=release -Dwerror=true
          meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
      - name: Run the release binary
        run: ./build/apps/farland-server --fingerprint
      - name: Build the Debian package
        run: |
          sudo apt-get install -y --no-install-recommends dpkg-dev file
          sh packaging/make-deb.sh build "$RUNNER_TEMP/pkg"
      - name: Install it and start the multi-session service
        run: |
          sudo apt-get install -y "$RUNNER_TEMP"/pkg/farland_*.deb
          systemctl is-enabled farlandd
          systemctl is-active farlandd || { sudo journalctl -u farlandd --no-pager -n 40; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: farland-deb
          path: ${{ runner.temp }}/pkg/*.deb
          retention-days: 14
