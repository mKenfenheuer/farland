version = 1

# Files that cannot or do not carry SPDX headers themselves.
[[annotations]]
path = [
  "**/*.md",
  "fuzz/corpus/**",
  "tests/data/**",
  "subprojects/*.wrap",
  ".clang-format",
  ".clang-tidy",
  ".editorconfig",
  ".gitignore",
  ".pre-commit-config.yaml",
  "NOTICE",
  "REUSE.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Maximilian Kenfenheuer"
SPDX-License-Identifier = "Apache-2.0"

# Wayland protocol descriptions vendored for the wlroots backend: the wlroots
# protocols no package installs, and stand-ins for older wayland-protocols.
# Each file carries its licence text.
[[annotations]]
path = [
  "src/farland/platform/wlroots/protocols/ext-image-capture-source-v1.xml",
  "src/farland/platform/wlroots/protocols/ext-image-copy-capture-v1.xml",
  "src/farland/platform/wlroots/protocols/virtual-keyboard-unstable-v1.xml",
  "src/farland/platform/wlroots/protocols/wlr-screencopy-unstable-v1.xml",
  "src/farland/platform/wlroots/protocols/wlr-virtual-pointer-unstable-v1.xml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "2008-2011 Kristian Høgsberg",
  "2010-2013 Intel Corporation",
  "2012-2013 Collabora, Ltd.",
  "2018 Purism SPC",
  "2018 Simon Ser",
  "2019 Andri Yngvason",
  "2019 Josef Gajdusek",
  "2021-2023 Andri Yngvason",
  "2022 Andri Yngvason",
  "2024 Simon Ser",
]
SPDX-License-Identifier = "MIT"

