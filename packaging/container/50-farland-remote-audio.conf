#
# A container has no sound card, so WirePlumber falls back to a "Dummy
# Output", which the desktops show as no device at all. This sink stands in
# for one: applications play into it, and farland sends what it hears to the
# client (rdpsnd).

context.objects = [
    {   factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "remote-audio"
            node.description        = "Remote Audio"
            media.class             = Audio/Sink
            object.linger           = true
            audio.position          = [ FL FR ]
            monitor.channel-volumes = true
            priority.session        = 1009
            priority.driver         = 1009
        }
    }
]
